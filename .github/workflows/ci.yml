name: DevFinder CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev
    - name: Configure CMake
      run: cmake -B backend/build -S backend
    - name: Build
      run: cmake --build backend/build
    - name: Test
      run: cd backend/build && ctest --output-on-failure
